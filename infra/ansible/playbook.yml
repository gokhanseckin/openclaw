---
- name: OpenClaw deploy (additive — does not touch tbc stack)
  hosts: openclaw
  become: true
  gather_facts: true

  pre_tasks:
    - name: Sanity check — port {{ openclaw_port }} is free (or held by openclaw-gateway)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          holder=$(ss -tlnpH "sport = :{{ openclaw_port }}" | head -1)
          if [ -z "$holder" ]; then
            exit 0
          fi
          # Re-runs are expected: if the listener is our own gateway, that's fine.
          # ss truncates the comm to 15 chars: openclaw-gatewa.
          if echo "$holder" | grep -q openclaw-gatewa; then
            exit 0
          fi
          echo "Port {{ openclaw_port }} is held by something other than openclaw-gateway:"
          echo "$holder"
          exit 1
        executable: /bin/bash
      changed_when: false

    - name: Sanity check — Caddyfile is currently valid
      ansible.builtin.command: caddy validate --config /etc/caddy/Caddyfile
      changed_when: false

  roles:
    - openclaw
